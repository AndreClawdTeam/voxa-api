services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: voxa_db
      POSTGRES_USER: voxa
      POSTGRES_PASSWORD: voxa_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voxa -d voxa_db']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxa:voxa_secret@postgres:5432/voxa_db
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
